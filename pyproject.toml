[project]
name = "procurement-navigator"
version = "0.1.0"
description = "Keeps an always-current picture of vendor-review deals and turns it into next actions."
requires-python = ">=3.12"
dependencies = ["streamlit>=1.40", "pyyaml>=6", "httpx>=0.27"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
